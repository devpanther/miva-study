<script>
/* Registering the worker is what makes Android offer "Install app", and what keeps the
   shell readable when the connection drops. Signed-in data is never cached — see sw.js. */
if ("serviceWorker" in navigator) {
  addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){ /* fine without it */ });
  });
}
